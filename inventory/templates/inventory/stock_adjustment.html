{% extends "base.html" %}

{% block title %}StockFlow{% endblock %}

{% block content %}
    <h1>Adjust stock: {{ product.name }}</h1>

    <p>Current stock: {{ product.stock_quantity }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save adjustment</button>
    </form>

    <a href="{% url 'inventory:product_detail' pk=product.pk %}">
        Cancel
    </a>
{% endblock %}
