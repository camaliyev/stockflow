{% extends "base.html" %}

{% block title %}StockFlow{% endblock %}

{% block content %}
    <h1>
        {% if product %}
            Edit {{ product.name }}
        {% else %}
            Add product
        {% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save product</button>
    </form>

    {% if product %}
        <a href="{% url 'inventory:product_detail' pk=product.pk %}">Cancel</a>
    {% else %}
        <a href="{% url 'inventory:product_list' %}">Cancel</a>
    {% endif %}
{% endblock %}
