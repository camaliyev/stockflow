<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit quantity | StockFlow</title>
</head>
<body>
    <h1>Edit quantity: {{ item.product.name }}</h1>

    <p>Order #{{ order.pk }}</p>
    <p>Current quantity: {{ item.quantity }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save quantity</button>
    </form>

    <p>
        <a href="{% url 'orders:order_detail' order.pk %}">
            Cancel
        </a>
    </p>
</body>
</html>
