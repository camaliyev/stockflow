<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in | StockFlow</title>
</head>
<body>
    <h1>Log in to StockFlow</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">Log in</button>
    </form>
</body>
</html>
