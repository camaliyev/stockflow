{% extends "base.html" %}

{% block title %}Log in | StockFlow{% endblock %}

{% block content %}
    <h1>Log in to StockFlow</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">Log in</button>
    </form>
{% endblock %}
